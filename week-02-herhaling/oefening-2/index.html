<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 2 — Oefening 2: DOM-manipulatie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 id="title">Basis DOM-manipulatie</h1>
  </header>

  <main>

    <section>
      <h2>1. Titel aanpassen</h2>
      <p>Verander de tekst van de titel hierboven.</p>
    </section>

    <section>
      <h2>2. Kleur wisselen</h2>
      <p id="message">Deze tekst wisselt van kleur.</p>
      <button id="toggle-btn">Wissel kleur</button>
    </section>

    <section>
      <h2>3. Begroeting</h2>
      <input type="text" id="name-input" placeholder="Jouw naam">
      <button id="greet-btn">Begroet mij</button>
      <p id="greeting"></p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
