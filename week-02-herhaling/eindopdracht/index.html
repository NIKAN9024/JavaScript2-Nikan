<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kortingscalculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Kortingscalculator</h1>
  </header>
  <main>
    <section class="form">
      <h2>Bereken je korting</h2>
      <form id="discount-form">
        <input type="number" id="amount" placeholder="Bestelbedrag (€)">
        <input type="number" id="discount" placeholder="Korting (%)">
        <button type="submit" id="button">Bereken</button>
      </form>
    </section>
    <section>
      <h2>Resultaat</h2>
      <p id="result"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
