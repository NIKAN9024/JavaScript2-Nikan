<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nieuwsfeed</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Nieuwsfeed</h1>
    </header>
    <main>
      <nav id="category-nav" aria-label="Nieuwscategorieën">
        <button
          id="filter-alle"
          type="button"
          class="active"
          aria-pressed="true"
        >
          Alle
        </button>
        <button id="filter-stad" type="button" aria-pressed="false">
          Stad
        </button>
        <button id="filter-technologie" type="button" aria-pressed="false">
          Technologie
        </button>
        <button id="filter-media" type="button" aria-pressed="false">
          Media
        </button>
      </nav>
      <section id="articles"></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
